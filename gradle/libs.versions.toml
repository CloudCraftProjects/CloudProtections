[versions]
pluginyml = "0.6.0"
runtask = "3.0.0"
shadow = "8.3.9"
publishing = "1.0.0"

minecraft = "1.21.10"
paperapi = "1.21.10-R0.1-SNAPSHOT"

cloudcore = "1.1.1-SNAPSHOT"

bstats = "3.1.0"
commandapi = "11.0.0"

[plugins]
pluginyml-bukkit = { id = "net.minecrell.plugin-yml.bukkit", version.ref = "pluginyml" }
runpaper = { id = "xyz.jpenilla.run-paper", version.ref = "runtask" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
publishing = { id = "me.modmuss50.mod-publish-plugin", version.ref = "publishing" }

[libraries]
paperapi = { module = "io.papermc.paper:paper-api", version.ref = "paperapi" }

cloudcore = { module = "dev.booky:cloudcore", version.ref = "cloudcore" }

bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
commandapi-paper-core = { module = "dev.jorel:commandapi-paper-core", version.ref = "commandapi" }
commandapi-paper-plugin = { module = "dev.jorel:commandapi-paper-plugin", version.ref = "commandapi" }
